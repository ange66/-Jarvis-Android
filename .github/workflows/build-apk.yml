
name: Construire JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decompresser JARVIS
        run: unzip -q JARVIS-V3-Android.zip

      - name: Compiler APK
        working-directory: Jarvis
        run: gradle --no-daemon assembleDebug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V3-APK
          path: Jarvis/app/build/outputs/apk/debug/app-debug.apk
          
